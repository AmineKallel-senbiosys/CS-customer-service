  - id: KB-31
    intent: Firmware update stuck / fails
    customer_asks: My firmware update is stuck (e.g. at 21%). The update won't complete.
    audience: customer
    requires_otp: false
    tools: [ring_api.firmware_version, hubspot.create_ticket]
    facts: [FACT-FACTORY-RESET, FACT-DATA-ACCOUNT, FACT-APP-STORES]
    procedure:                               # one step at a time
      - step: step_1
      - step: step_2
      - exit: step_3
    templates:
      step_1:
        uses: [FACT-DATA-ACCOUNT, FACT-APP-STORES]
        text: |
          Let's get your update through. First, place your ring on the charger, open the Velia app and let it sync your latest data. Then delete the Velia app, reinstall the latest version from the App Store / Google Play, allow all permissions (Bluetooth, location, background activity), log in with the same email and pair your ring while it's on the charger. Then try the update again.
      step_2:
        uses: [FACT-FACTORY-RESET]
        text: |
          If the update is still stuck: with the ring on the charger, open the Velia app, go to the Ring section and select 'Factory reset'. Then 'forget' the ring in your phone's Bluetooth settings, pair it again in the app and retry the update.
      step_3:
        uses: [POL-TICKETS]
        text: |
          If it still doesn't complete, could you please send us a short video showing these steps, and confirm the email address linked to your account? We'll escalate your case to our technical team right away.
    never: [factory reset before syncing, send all steps at once]
    escalation: Step 3 → HubSpot ticket for the technical team
    source: Khadija T5, T38 (rewritten and validated 28/09)
    status: validated
    owner: Walid
    last_reviewed: 2026-09-28
    review_trigger: firmware release

