open_decisions:
  DEC-01: DECIDED 28/09 – answer, then offer a human on strong frustration (POL-ESC-FRUSTRATION).
  DEC-02: DECIDED 28/09 – offer a human after two failed clarifications (POL-ESC-NOT-UNDERSTOOD).
  DEC-03: DECIDED 28/09 – Velio reads the ring API (ready) and gives an OK / not OK verdict without values (POL-BATTERY-VERDICT, KB-03).
  DEC-04: DECIDED 28/09 – heating/burn (KB-24) and skin reaction (KB-25) escalate as urgent HubSpot tickets (POL-SAFETY-ESC).
  DEC-05: DECIDED 28/09 – no refund or exchange after 14 days (except defective ring) (POL-AFTER-14D).
  DEC-06: DECIDED 28/09 – answer honestly when asked directly (POL-RETURN-PORTAL template_if_asked).
  DEC-07: DECIDED 28/09 – 1 year, or longer where local law requires; answered only when asked (POL-NO-WARRANTY-MENTION).
  DEC-08: DECIDED 28/09 – no cancellation before shipping (POL-NO-CANCEL, KB-06 cancel_request).
  DEC-09: DECIDED 28/09 – kit sent to every customer, never an extra kit, guidance for unsure customers; digital sizing on hold (POL-SIZING-KIT).
  DEC-10: DECIDED 28/09 – all of Khadija's draft facts validated (with corrections) or dropped.
  DEC-11: PARTLY DECIDED 28/09 – wellness device (KB-42); no sales for now (KB-41). STILL OPEN – metrics measured and OS compatibility (Walid to provide).
  DEC-12: DECIDED 28/09 – lost email access → human; 3 attempts per code, 3 codes per hour; email change after OTP, done by a human (POL-ID-EDGE-CASES).
  DEC-13: DECIDED 28/09 – ring-by-ring status; customs apply per parcel; grouping request → human (KB-38).
  DEC-14: DECIDED 28/09 – delivered-not-received checklist then human (KB-39); lost ring → human (KB-40).
  DEC-15: DECIDED 28/09 – human handover = HubSpot ticket answered by email, Swiss office hours, reply "as soon as possible" (POL-HUMAN-HANDOVER).
  DEC-16: DECIDED 28/09 – no sales for now; Velio says rings/accessories aren't available to order (KB-41). Upsell comes in V2.
  DEC-17: DECIDED 28/09 – allowed in a served country with a phone number; onward shipping and customs on the customer (KB-02 forwarder_address).
  DEC-18: DECIDED 28/09 – Walid owns all articles for now; review cadence in meta.
  DEC-19: DECIDED 28/09 – Bluetooth stays active 20 seconds after a double tap (FACT-BT).
  DEC-20: DECIDED 28/09 – a non-destructive reboot exists (app, Ring section); used in KB-17 after the resync when data is still missing.
  DEC-21: DECIDED 28/09 – Velio opens a HubSpot ticket and a human sends the commercial invoice (KB-26).
  DEC-23: Battery thresholds – engineering to define the OK / not OK criteria (battery health %, cycles, measured battery life) used by POL-BATTERY-VERDICT.
  DEC-22: DECIDED 28/09 – lost or not received sizing kit goes to a human, no automatic resend (POL-SIZING-KIT).
