    never: [interpret the data medically]
    escalation: Clear error reported → HubSpot ticket for the technical team
    source: Khadija KB (validated by Walid)
    volume: 43
    status: validated
    owner: Walid
    last_reviewed: 2026-09-24
    review_trigger: app or algorithm release

  - id: KB-24
    intent: Ring heating / burn (safety)
    customer_asks: My ring is getting hot on my finger. The ring burned me. The ring gets hot while charging.
    audience: customer
    requires_otp: false
    tools: [hubspot.create_ticket]
    policies: [POL-SAFETY-ESC]
    facts: [FACT-CHARGING-WARMTH]
    branches:
      - when: ring slightly warm while charging, no discomfort
        action: reassure – some warmth while charging is normal (FACT-CHARGING-WARMTH); if it becomes hot to the touch or hurts, apply the safety branch
      - when: ring hot on the finger, burn, or ring too hot to touch
        template: safety
        action: priority HubSpot ticket, human takes over (POL-SAFETY-ESC)
    templates:
      safety:
        uses: [POL-SAFETY-ESC]
        text: |
          I'm sorry to hear that – your safety comes first. Please take the ring off right away and, if it's on the charger, unplug the charger and stop using both for now. If your skin feels hurt, please take care of it and seek medical advice if needed. I'm passing your case to our team as a priority. Could you tell me what happened and, if possible, send a photo of the ring and the charger?
    never: [suggest re-aligning the ring as the answer to a heating complaint, say that a hot ring on the finger is normal, promise a replacement or refund]
    escalation: Mandatory – priority HubSpot ticket (POL-SAFETY-ESC)
    source: Khadija T32 (replaced by this validated answer)
    status: validated
    owner: Walid
