      steps:
        uses: [FACT-CHARGER-BASE, FACT-CHARGER-ALIGN]
        text: |
          Sorry to hear your ring isn't charging – let's fix that. Please try the following:
          1. Make sure the charging station is connected via USB-C and the LED in the middle of the base shows a steady green.
          2. Place the ring on the charger, aligning the Velia logo inside the ring with the dot on the base – a green pulse from the ring confirms it's charging.
          3. Gently adjust the ring's position and push it all the way down to ensure full contact with the charger.
          4. Try a different USB-C cable and power source.
      exit:
        uses: [POL-TICKETS]
        text: |
          If it's still not charging, could you please send us a short video showing these steps, and confirm the email address linked to your Velia account? We'll escalate your case to our technical team.
      charger_faulty:
        text: |
          We're sorry your charger isn't working properly. Please try different USB-C cables and power sources. If it still doesn't work, could you please record a short video showing the charger plugged into a power source, then unplugging the cable and using the same cable to charge another device? This helps us see whether the issue is the charger, the cable or the power source. If you upload the video, please share it without access restrictions.
