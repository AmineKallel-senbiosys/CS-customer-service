  - id: KB-08
    intent: Ring not syncing
    customer_asks: My ring doesn't sync with the app. The app doesn't show my data.
    audience: customer
    requires_otp: false                      # true if ring_api.last_sync is used
    tools: [ring_api.last_sync, hubspot.create_ticket]
    facts: [FACT-BT, FACT-DATA-ACCOUNT, FACT-FACTORY-RESET]
    procedure:   # one step at a time; skip steps the customer says they already tried
      - step: step_1
      - step: step_2
      - exit: step_3                         # video + account email → HubSpot ticket
    templates:
      step_1:
        uses: [FACT-BT]
        text: |
          Step 1 – Let's get your ring syncing! Try one of these two options:
          • Via the charger: place your ring on the charger, then open the Velia app. The ring's Bluetooth stays active while charging, so the app should detect it automatically – watch the sync icon at the top right of the app.
          • Via double tap: open the Velia app first, then double tap your ring. The green LEDs will flash, meaning Bluetooth is active for 20 seconds – watch the sync icon during that window.
      step_2:
        uses: [FACT-DATA-ACCOUNT]
        text: |
          Step 2 – If that doesn't work, please:
          1. 'Forget' the ring in your phone's Bluetooth settings.
          2. Delete the Velia app.
          3. Restart your phone.
          4. Reinstall the latest Velia app and allow all permissions (Bluetooth, location, background activity).
          5. Place the ring on the charger, open the app and pair it again.
          Your data won't be lost – it is linked to your account.
      step_3:
        uses: [POL-TICKETS]
        text: |
          Step 3 – If it still doesn't work: could you please send us a short video showing these steps, and confirm the email address linked to your account? We'll escalate your case to our technical team right away.
      connection_check:
        uses: [FACT-CONNECTED-CHECK]
        status: validated   # 28/09
        text: |
          Can you see your ring's battery level at the top right of the app's home screen? If so, your ring is connected.
    never: [suggest a factory reset, send all steps at once]
    escalation: Step 3 → HubSpot ticket for the technical team
    source: Khadija KB (validated by Walid)
    volume: 138
    related: [KB-31]
    status: validated
    owner: Walid
    last_reviewed: 2026-09-24
    review_trigger: firmware or app release

  - id: KB-09
    intent: Ring not connecting / pairing
    customer_asks: My ring won't connect to the app. It only connects when on the charger.
    audience: customer
    requires_otp: false
    tools: [hubspot.create_ticket]
    facts: [FACT-CHARGER-ALIGN, FACT-BT, FACT-DATA-ACCOUNT]
    branches:
      - when: ring never connects
        procedure: [step_1, step_2, step_3]
      - when: ring only connects while on the charger
        template: only_on_charger
        note: Either double-tap technique or a battery that no longer holds; the video tells which.
    templates:
      step_1:
        uses: [FACT-CHARGER-ALIGN]
        text: |
          Step 1 – Let's get your ring connected. Please try the following:
          1. Place the ring on the charger, aligning the Velia logo inside the ring with the dot on the base – a green pulse confirms it's charging.
          2. Remove the ring from your phone's Bluetooth list, if it appears there.
          3. Temporarily turn off other nearby Bluetooth devices, as they can interfere with pairing.
          4. Close the Velia app completely, reopen it and pair the ring while it is still on the charger.
      step_2:
        uses: [FACT-DATA-ACCOUNT]
        text: |
          Step 2 – If it still doesn't connect: 'Forget' the ring in your Bluetooth settings, delete the Velia app, restart your phone, reinstall the latest app allowing all permissions (Bluetooth, location, background activity), then pair again with the ring on the charger. Your data won't be lost – it is linked to your account.
      step_3:
        uses: [POL-TICKETS]
        text: |
          Step 3 – If it still doesn't work: could you please send us a short video showing these steps, and confirm the email address linked to your account? We'll escalate your case to our technical team right away.
      only_on_charger:
        uses: [FACT-BT]
        text: |
          Your ring's Bluetooth is only active while it is on the charger, or for 20 seconds after a double tap. To sync away from the charger: open the Velia app first, then double tap your ring firmly – the green LEDs flash – and watch the sync icon within the next 20 seconds. If the ring still only connects on the charger, could you please send us a short video of you doing the double tap and syncing? This will help us check whether it's the gesture or the battery.
      connection_check:
        uses: [FACT-CONNECTED-CHECK]
        status: validated   # 28/09
        text: |
          Can you see your ring's battery level at the top right of the app's home screen? If so, your ring is connected.
    never: [suggest a factory reset, promise a replacement]
    escalation: Step 3 / video received → HubSpot ticket for the technical team
    source: Khadija KB (validated by Walid)
    volume: 130
    status: validated
    owner: Walid
